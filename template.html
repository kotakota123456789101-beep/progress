<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Wick 進行管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: 状況バンド → 3タブ(概要/タスク/日報)。概要はプロジェクトカードとメンバー負荷、タスクは状態別の列、日報は日付リスト+本文 */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --line:#dde3e6; --fg:#16212a; --muted:#5d6b75;
  --accent:#0f5e6e; --accent-soft:#e2eff1;
  --crit:#b8322a; --crit-soft:#fbe9e7; --warn:#a86a00; --warn-soft:#fbf1dc;
  --ok:#2c7a43; --ok-soft:#e5f3e8; --info:#2a5fa8; --info-soft:#e6eef9; --idle:#78848c; --idle-soft:#eceff1;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172026; --line:#26323a; --fg:#e4eaee; --muted:#93a1ab;
  --accent:#5fb6c4; --accent-soft:#163238;
  --crit:#f0837a; --crit-soft:#3a1d1b; --warn:#e3b04f; --warn-soft:#352a14;
  --ok:#74c98c; --ok-soft:#18301f; --info:#7fa9e6; --info-soft:#1a2a40; --idle:#8c99a2; --idle-soft:#1f292f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172026; --line:#26323a; --fg:#e4eaee; --muted:#93a1ab;
  --accent:#5fb6c4; --accent-soft:#163238;
  --crit:#f0837a; --crit-soft:#3a1d1b; --warn:#e3b04f; --warn-soft:#352a14;
  --ok:#74c98c; --ok-soft:#18301f; --info:#7fa9e6; --info-soft:#1a2a40; --idle:#8c99a2; --idle-soft:#1f292f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:900;font-size:1.75rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:.12em}
.meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:.8rem}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.alert{border-left:4px solid var(--crit);background:var(--crit-soft);padding:12px 16px;border-radius:4px;display:flex;flex-direction:column;gap:4px}
.alert.calm{border-color:var(--ok);background:var(--ok-soft)}
.alert b{font-family:var(--f-display);font-size:1rem}
.alert .sub{font-size:.85rem;color:var(--muted)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav a{padding:8px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0;letter-spacing:.03em}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-head span{font-size:.8rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:1rem;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.04em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-crit{color:var(--crit);background:var(--crit-soft)}.s-warn{color:var(--warn);background:var(--warn-soft)}
.s-ok{color:var(--ok);background:var(--ok-soft)}.s-info{color:var(--info);background:var(--info-soft)}.s-idle{color:var(--idle);background:var(--idle-soft)}
.small{font-size:.82rem;color:var(--muted)}
.due{font-family:var(--f-mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.due.over{color:var(--crit);font-weight:500}
.tag{font-size:.72rem;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:4px;white-space:nowrap}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--idle-soft)}
.bar i{display:block;height:100%}
.counts{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.counts b{font-family:var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums;margin-right:2px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;font-size:.86rem}
.list li span:first-child{min-width:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;font-size:.85rem;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.board{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:4px;border-bottom:2px solid var(--line)}
.col-h b{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.task.blocked{border-left:3px solid var(--crit)}
.task .t{font-weight:500;font-size:.9rem;overflow-wrap:anywhere}
.task .m{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.task .row{justify-content:flex-start}
.empty{color:var(--muted);font-size:.85rem;padding:12px 0}
.daily{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}
@media (max-width:720px){.daily{grid-template-columns:1fr}}
.days{display:flex;flex-direction:column;gap:6px}
.day{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day .d{font-family:var(--f-mono);font-weight:500}
.day .x{font-size:.75rem;color:var(--muted)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 20px;min-width:0;max-width:72ch}
.doc h4{font-family:var(--f-display);font-size:1rem;margin:16px 0 6px}
.doc h5{font-size:.92rem;margin:12px 0 4px}
.doc p,.doc ul{margin:6px 0}
.doc ul{padding-left:1.2em}
.doc a{color:var(--accent)}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted);font-size:.9rem}
.notice.err{border-style:solid;border-color:var(--warn);color:var(--fg)}
a.ext{color:var(--accent);font-size:.8rem}
details summary{cursor:pointer;color:var(--accent);font-size:.82rem}
details .doc{border:none;padding:4px 0 0;max-width:none}
details .doc h4:first-child{margin-top:4px}
@media (prefers-reduced-motion:no-preference){.card,.task{transition:border-color .15s}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>WICK · PROGRESS</small>進行管理</h1>
    <div class="meta"><span id="updated">読み込み中…</span></div>
  </header>

  <div id="alert" class="alert calm"><b>読み込み中</b><span class="sub">最新のデイリーサマリーを取得しています</span></div>
  <div id="pageNotice" hidden></div>

  <nav aria-label="表示切り替え">
    <a href="#overview" data-view="overview">概要</a>
    <a href="#tasks" data-view="tasks">タスク</a>
    <a href="#daily" data-view="daily">日報サマリー</a>
  </nav>

  <div id="view-overview" class="view">
    <section>
      <div class="sec-head"><h2>プロジェクト</h2><span>日報をもとに毎晩20時にAIが更新</span></div>
      <div class="grid" id="projects"><div class="empty">プロジェクトを読み込み中…</div></div>
    </section>
    <section style="margin-top:24px">
      <div class="sec-head"><h2>メンバー</h2><span>未完了タスクの内訳と今週やること</span></div>
      <div class="grid" id="members"><div class="empty">メンバーを読み込み中…</div></div>
    </section>
  </div>

  <div id="view-tasks" class="view" hidden>
    <section>
      <div class="sec-head">
        <h2>タスク</h2>
        <div class="filters">
          <label class="small" for="fProject">プロジェクト</label>
          <select id="fProject"><option value="">すべて</option></select>
          <label class="small" for="fOwner">担当</label>
          <select id="fOwner"><option value="">すべて</option></select>
        </div>
      </div>
      <div class="board" id="board"><div class="empty">タスクを読み込み中…</div></div>
    </section>
  </div>

  <div id="view-daily" class="view" hidden>
    <section>
      <div class="sec-head"><h2>日報サマリー</h2><span>1日1ページ</span></div>
      <div class="daily">
        <div class="days" id="days"><div class="empty">読み込み中…</div></div>
        <article class="doc" id="doc"><div class="empty">日付を選ぶと内容が表示されます</div></article>
      </div>
    </section>
  </div>
</div>

<script>
const state = { tasks: null, projects: null, days: null, selDay: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayJST = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
const md = d => d ? `${+d.slice(5,7)}/${+d.slice(8,10)}` : "";
const PSTAT = {"要注意":"s-crit","情報不足":"s-warn","順調":"s-ok","動きなし":"s-idle"};
const TSTAT = ["ブロック中","進行中","未着手","完了"];
const TCLS = {"ブロック中":"s-crit","進行中":"s-info","未着手":"s-idle","完了":"s-ok"};
const PRIO = {"高":0,"中":1,"低":2};
const isOver = t => t.due && t.status !== "完了" && t.due < todayJST();
const dueHtml = t => t.due ? `<span class="due${isOver(t) ? " over" : ""}">${isOver(t) ? "期限切れ " : ""}${md(t.due)}</span>` : `<span class="due">期限なし</span>`;
const list = v => Array.isArray(v) ? v : (v ? [v] : []);

function mdToHtml(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  let out = [], inList = false;
  for (const raw of String(src || "").split("\n")) {
    const line = raw.trim();
    if (/^[-*] /.test(line)) { if (!inList) { out.push("<ul>"); inList = true; } out.push(`<li>${inline(line.slice(2))}</li>`); continue; }
    if (inList) { out.push("</ul>"); inList = false; }
    if (!line) continue;
    if (line.startsWith("### ")) out.push(`<h5>${inline(line.slice(4))}</h5>`);
    else if (line.startsWith("## ")) out.push(`<h4>${inline(line.slice(3))}</h4>`);
    else if (line.startsWith("# ")) out.push(`<h4>${inline(line.slice(2))}</h4>`);
    else out.push(`<p>${inline(line)}</p>`);
  }
  if (inList) out.push("</ul>");
  return out.join("");
}

/* ---------- 描画 ---------- */
function renderAlert() {
  const el = $("alert");
  if (!state.days) return;
  const d = state.days[0];
  if (!d) { el.className = "alert calm"; el.innerHTML = `<b>サマリーはまだありません</b><span class="sub">毎晩20時に日報からまとめます</span>`; return; }
  el.className = "alert" + (d.flag ? "" : " calm");
  el.innerHTML = `<b>${d.flag ? "要注意" : "大きな問題なし"} · ${esc(md(d.date))}</b>
    <span>${esc(d.flagText || "要注意事項なし")}</span>
    <span class="sub">日報提出 ${esc(d.sub || "—")}</span>`;
}

function renderProjects() {
  const el = $("projects");
  if (!state.projects) return;
  if (!state.projects.length) { el.innerHTML = `<div class="empty">プロジェクトはまだありません。日報に [プロジェクト名] が出てくると、毎晩の更新で追加されます。</div>`; return; }
  const order = {"要注意":0,"情報不足":1,"順調":2,"動きなし":3};
  const ps = [...state.projects].sort((a,b) => (order[a.status] ?? 9) - (order[b.status] ?? 9) || String(a.name).localeCompare(b.name));
  el.innerHTML = ps.map(p => {
    const ts = (state.tasks || []).filter(t => t.project === p.name);
    const n = s => ts.filter(t => t.status === s).length;
    const total = ts.length || 1;
    const segs = [["完了","var(--ok)"],["進行中","var(--info)"],["ブロック中","var(--crit)"],["未着手","var(--idle)"]]
      .map(([s,c]) => n(s) ? `<i style="width:${n(s)/total*100}%;background:${c}" title="${s} ${n(s)}"></i>` : "").join("");
    return `<div class="card">
      <div class="row"><h3>${esc(p.name)}</h3><span class="pill ${PSTAT[p.status] || "s-idle"}">${esc(p.status || "未設定")}</span></div>
      <div>${esc(p.summary || "")}</div>
      ${state.tasks ? `<div class="bar" aria-label="タスクの内訳">${segs}</div>
      <div class="counts"><span><b>${n("完了")}</b>完了</span><span><b>${n("進行中")}</b>進行中</span><span><b>${n("ブロック中")}</b>ブロック</span><span><b>${n("未着手")}</b>未着手</span></div>` : ""}
      <div class="row small"><span>担当 ${esc(list(p.owners).join("・") || "—")}</span><span>次の期限 <span class="due">${p.due ? md(p.due) : "未定"}</span></span></div>
      ${p.body ? `<details><summary>現状・リスク・経過を見る</summary><div class="doc">${mdToHtml(p.body)}</div></details>` : ""}
    </div>`;
  }).join("");
}

function sortTask(a,b) {
  const ad = a.due || "9999", bd = b.due || "9999";
  return ad.localeCompare(bd) || (PRIO[a.prio] ?? 3) - (PRIO[b.prio] ?? 3);
}

function renderMembers() {
  const el = $("members");
  if (!state.tasks) return;
  const owners = [...new Set(state.tasks.map(t => t.owner).filter(Boolean))].sort();
  if (!owners.length) { el.innerHTML = `<div class="empty">担当者のついたタスクはまだありません</div>`; return; }
  el.innerHTML = owners.map(o => {
    const ts = state.tasks.filter(t => t.owner === o && t.status !== "完了");
    const c = s => ts.filter(t => t.status === s).length;
    const week = ts.filter(t => t.week).sort(sortTask);
    const over = ts.filter(isOver).length;
    return `<div class="card">
      <div class="row"><h3>${esc(o)}</h3>${c("ブロック中") ? `<span class="pill s-crit">ブロック ${c("ブロック中")}</span>` : `<span class="pill s-ok">止まりなし</span>`}</div>
      <div class="counts"><span><b>${ts.length}</b>未完了</span><span><b>${c("進行中")}</b>進行中</span><span><b>${c("未着手")}</b>未着手</span>${over ? `<span style="color:var(--crit)"><b style="color:var(--crit)">${over}</b>期限切れ</span>` : ""}</div>
      <div class="small">今週やること</div>
      ${week.length ? `<ul class="list">${week.map(t => `<li><span>${esc(t.name)}</span>${dueHtml(t)}</li>`).join("")}</ul>` : `<div class="empty" style="padding:0">なし</div>`}
    </div>`;
  }).join("");
}

function fillFilters() {
  const fill = (id, vals) => {
    const s = $(id), cur = s.value;
    s.innerHTML = `<option value="">すべて</option>` + vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
    if (vals.includes(cur)) s.value = cur;
  };
  fill("fProject", [...new Set(state.tasks.map(t => t.project).filter(Boolean))].sort());
  fill("fOwner", [...new Set(state.tasks.map(t => t.owner).filter(Boolean))].sort());
}

function renderBoard() {
  const el = $("board");
  if (!state.tasks) return;
  const fp = $("fProject").value, fo = $("fOwner").value;
  const ts = state.tasks.filter(t => (!fp || t.project === fp) && (!fo || t.owner === fo));
  el.innerHTML = TSTAT.map(s => {
    const l = ts.filter(t => t.status === s).sort(sortTask);
    return `<div class="col"><div class="col-h"><span class="pill ${TCLS[s]}">${s}</span><b>${l.length}</b></div>
      ${l.length ? l.map(t => `<div class="task${s === "ブロック中" ? " blocked" : ""}">
        <div class="t">${esc(t.name)}</div>
        <div class="row">${t.project ? `<span class="tag">${esc(t.project)}</span>` : ""}<span class="small">${esc(t.owner || "担当未定")}</span>${t.prio === "高" ? `<span class="pill s-crit" style="padding:0 7px">高</span>` : ""}</div>
        ${t.memo ? `<div class="m">${esc(t.memo)}</div>` : ""}
        <div>${dueHtml(t)}</div>
      </div>`).join("") : `<div class="empty">なし</div>`}
    </div>`;
  }).join("");
}

function renderDays() {
  const el = $("days");
  if (!state.days) return;
  if (!state.days.length) { el.innerHTML = `<div class="empty">サマリーはまだありません</div>`; $("doc").innerHTML = `<div class="empty">毎晩20時に、その日の日報をまとめたページが追加されます</div>`; return; }
  if (!state.selDay || !state.days.some(d => d.id === state.selDay)) state.selDay = state.days[0].id;
  el.innerHTML = state.days.map(d => `<button type="button" class="day" data-id="${esc(d.id)}" aria-pressed="${d.id === state.selDay}">
    <span class="row"><span class="d">${esc(md(d.date))}</span>${d.flag ? `<span class="pill s-crit" style="padding:0 7px">要注意</span>` : ""}</span>
    <span class="x">提出 ${esc(d.sub || "—")}</span></button>`).join("");
  renderDoc();
}
function renderDoc() {
  const d = state.days.find(x => x.id === state.selDay);
  if (!d) return;
  $("doc").innerHTML = `<h2>${esc(d.title || md(d.date) + " デイリーサマリー")}</h2>` + (mdToHtml(d.body) || `<div class="empty">本文はありません</div>`);
}

/* ---------- ルーティング ---------- */
const VIEWS = ["overview","tasks","daily"];
function route() {
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
  VIEWS.forEach(x => { $("view-" + x).hidden = x !== v; });
  document.querySelectorAll("nav a").forEach(a => a.setAttribute("aria-current", a.dataset.view === v ? "page" : "false"));
}
addEventListener("hashchange", route); route();
$("fProject").addEventListener("change", renderBoard);
$("fOwner").addEventListener("change", renderBoard);
$("days").addEventListener("click", e => {
  const b = e.target.closest(".day"); if (!b) return;
  state.selDay = b.dataset.id;
  document.querySelectorAll(".day").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderDoc();
});

/* ---------- データ(ビルド時に埋め込み) ---------- */
const DATA = /*__DATA__*/null;
(function () {
  if (!DATA) { $("updated").textContent = "データがありません"; return; }
  state.tasks = DATA.tasks || [];
  state.projects = DATA.projects || [];
  state.days = (DATA.days || []).slice().sort((a,b) => String(b.date).localeCompare(String(a.date)));
  const d = new Date(new Date(DATA.builtAt).getTime() + 9*3600e3);
  $("updated").textContent = isNaN(d) ? "" : `最終更新 ${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`;
  fillFilters(); renderAlert(); renderProjects(); renderMembers(); renderBoard(); renderDays();
})();
</script>
</body>
</html>
